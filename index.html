/* Battle HUD draft for the next visual integration. Scope: battlefield only.
 * Append after existing rules. No TT2 panel selectors, coordinates or game logic. */
.titansGame .stage .hud{position:absolute;top:11px;left:14px;right:auto;bottom:auto;width:auto;max-width:calc(100% - 28px);height:24px;display:block;padding:0;margin:0;background:none;border:0;z-index:7;pointer-events:none;text-shadow:0 1px 3px #10131a}
.titansGame .stage .hud>*{display:none}
.titansGame .stage .hud>.compactHeroHud{display:block;color:#f5f0e2;font-size:14px;line-height:23px;letter-spacing:0;white-space:nowrap;font-weight:600}
.titansGame .stage .bossbar{position:absolute;top:45px;left:14px;right:14px;bottom:auto;width:auto;max-width:650px;margin:0 auto;padding:6px 10px 5px;z-index:6;border:1px solid #99816b55;border-radius:3px;background:#171b24d9;text-shadow:0 1px 2px #100e13;pointer-events:none;text-align:center;line-height:1.25}
.titansGame .stage .bossbar #bossName{display:block;color:#f7d5bc;font-size:14px;letter-spacing:.5px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titansGame .stage .bossbar .bar{height:8px;border:1px solid #a4655a;border-radius:2px;background:#2e2028;box-shadow:none;margin:4px 0}
.titansGame .stage .bossbar #bossHealth{display:inline-block;color:#e6d2ca;font-size:12px;line-height:16px;white-space:nowrap;margin:0}
.titansGame .stage .bossbar #bossStagger{display:inline-block;color:#f0cf90;font-size:12px;letter-spacing:1px;line-height:16px;white-space:nowrap;margin:0 0 0 12px}
/* One readable real tactic; no repeated charging instruction. */
.titansGame .stage .bossbar #bossTactic{display:block;color:#d2c7b7;font-size:12px;line-height:16px;max-height:16px;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titansGame .stage .wave{position:absolute;top:12px;left:auto;right:14px;bottom:auto;max-width:46%;padding:0;margin:0;background:none;z-index:7;text-align:right;line-height:1.3;pointer-events:none}
.titansGame .stage .wave #wave{display:block;font-size:13px;font-weight:500;line-height:20px;color:#e5d1ab;letter-spacing:0;text-shadow:0 1px 2px #12111a}
.titansGame .stage .wave #chapterGoal{display:none}
.titansGame .stage .wave #timer{display:block;margin:1px 0 0;font-size:12px;line-height:16px;color:#cfc6b2}
/* Kills/gold/duplicate operation sentences remain available in the report/settings. */
.titansGame .stage .bottom{display:none}
.titansGame .stage .toast{top:auto;bottom:86px;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:7px 12px;line-height:1.4;white-space:normal;font-size:13px;background:#20252ee8;color:#f4d9a9;border:1px solid #a28a6655;z-index:8;pointer-events:none}
.titansGame .stage .stageBanner{top:40%;left:12%;width:76%;font-size:18px;line-height:1.45;letter-spacing:.5px;color:#f4dfb8;text-shadow:0 2px 4px #14151d;z-index:5}

 .titansGame .stage .toast{bottom:109px;font-size:12px;max-width:calc(100% - 24px)}

}
@media(max-width:680px){

}

.titansGame .stage .bossbar{top:48px}

function selectTitanNode(i){if(!Number.isInteger(i)||i<0||i>8)return;titanNode=i;renderPane()}
function titanManualHaste(){return Math.max(1,Math.min(2.2,heroHaste()*(1+tValue('sword',1))))}
function titanHeroDamage(){return 1+tValue('sword',0)}
function titanSummonDamage(e){return (1+tValue('command',0))*(recast.burst>0?(tRank('command',8)?1.65:1.35):1)*(e===recast.mark&&recast.markTime>0?1+tValue('command',2):1)}
function titanRightBonus(e){return (e.slow>0||e.stun>0)?1+tValue('warden',7):1}
function titanShield(n){const before=run.shield;run.shield=Math.min(60,run.shield+n);titansCombat.stats.shield+=run.shield-before}
function titanFreeze(e,duration,factor=.2){const extra=advancedRuntime.right?.12*aRank('warden',0):0;e.slow=Math.max(e.slow||0,duration*(e.type===3?factor:1)+extra*(e.type===3?1/3:1));titansCombat.stats.roots++}
function titanSpawnGhostsBeforeLegions(n){if(n<=0)return;const desired=Math.min(3,n),room=Math.max(0,ARMY_CAP-units.length);for(let i=0;i<Math.min(desired,room)&&units.filter(u=>u.temporary).length<3;i++)units.push({id:88000+i+t,type:6,x:run.x+Math.cos(i*2)*30,y:run.y+Math.sin(i*2)*25,cd:0,cast:0,anim:0,moving:false,face:run.face,temporary:true,lifetime:8});placeRingSummons()}
function titanPickTarget(angle,range=440){let found=null,score=Infinity;for(const e of enemies){if(e.dead)continue;const d=dist(e,run),a=Math.abs(Math.atan2(Math.sin(Math.atan2(e.y-run.y,e.x-run.x)-angle),Math.cos(Math.atan2(e.y-run.y,e.x-run.x)-angle)));if(d<=range&&a<Math.PI*.45&&d<score){found=e;score=d}}return found}
function titanChain(...args){return sanguoTitanChain(...args)}
function resolveTitanActionUnadvanced(p){let hits=0;const isSlash=p.kind.startsWith('slash')||p.kind==='chargedSlash';if(isSlash){const charged=p.kind==='chargedSlash',third=p.kind==='slash3',radius=charged?115+25*p.charge:third?100:85,cone={shape:'cone',x:run.x,y:run.y,angle:p.angle,radius,arc:Math.PI*(charged?125:100)/180};p.radius=radius;for(const e of enemies.slice()){if(e.dead||!CombatStyle.contains(e,cone))continue;hits++;const multiplier=charged?(2.2+p.charge*1.3)*(1+tValue('sword',2)):third?1.4*(1+tValue('sword',4)):.9;damage(e,p.power*multiplier,'hero');if(!e.dead&&e.type!==3&&third){e.stun=Math.max(e.stun||0,.25);InkFeedback.shove(e,p.angle,26+6*tRank('sword',4));CombatStyle.cancelSource(e)}if(e.type===3&&charged)heavyBossHit(e);if(!combatAllowed())break}if(hits&&tRank('sword',5)){const before=run.hp;run.hp=Math.min(run.maxHp,run.hp+Math.min(3,hits)*tValue('sword',5));titansCombat.stats.healing+=run.hp-before}if(charged&&tRank('element',5)){const target=titanPickTarget(p.angle,300);if(target){titansCombat.stats.extraBolts+=tValue('element',5);titanChain(run,target,tValue('element',5),p.power*.35,0,true)}}sound(charged?'heavy':third?'finisher':'combo');emitRecastFX(p.kind,p);return hits}
if(p.kind==='bladeWave'){const amount=p.power*(2+p.charge*2)*(p.charge?1+tValue('sword',2):1),base={x:run.x,y:run.y,vx:Math.cos(p.angle)*440,vy:Math.sin(p.angle)*440,life:1.2,hits:new Set(),limit:tValue('sword',3),damage:amount,angle:p.angle,r:20+12*p.charge,returnRatio:tValue('sword',7),originX:run.x,originY:run.y};recast.waves.push(base);if(p.charge>=.95&&tRank('sword',8))recast.waves.push({...base,x:run.x-Math.cos(p.angle)*30,y:run.y-Math.sin(p.angle)*30,vx:Math.cos(p.angle)*400,vy:Math.sin(p.angle)*400,hits:new Set(),damage:amount*.5,returnRatio:0});sound('heavy');emitRecastFX('bladeWave',p)}
else if(p.kind==='commandMark'||p.kind==='commandBurst'){const target=titanPickTarget(p.angle);if(target){recast.mark=target;recast.markTime=6;damage(target,p.power*1.2*titanRightBonus(target),'hero');hits=1}titanShield(tValue('command',3));titanSpawnGhosts(tValue('command',6));if(p.kind==='commandBurst'){recast.burst=tValue('command',4)*(1+p.charge*.2);if(tRank('command',8)){for(const u of units)u.cd=0;titanSpawnGhosts(3)}}sound('upgrade');emitRecastFX(p.kind,p)}
else if(p.kind==='stormWave'){const target=titanPickTarget(p.angle);if(target){const n=Math.min(8,tValue('element',1)+Math.floor(p.charge*3)+aRank('element',0)),power=p.power*(1.8+p.charge*1.7)*(1+tValue('element',0)),result=titanChain(run,target,n,power,p.charge);hits=result.hit.size;if(p.charge>0){for(const e of enemies.slice())if(!e.dead&&dist(e,result.from)<65+p.charge*45){damage(e,power*.6*titanRightBonus(e),'hero');titansCombat.stats.splashes++}}if(tRank('element',8)){strikes.push({source:'hero',x:result.from.x,y:result.from.y,delay:.35,r:115,titanRight:true,damage:p.power*1.5*(1+tValue('element',0))});titansCombat.stats.skies++}}sound('heavy');emitRecastFX('stormWave',{...p,radius:150})}
else if(p.kind==='frostWave'){const radius=tValue('warden',1)+p.charge*35,cone={shape:'cone',x:run.x,y:run.y,angle:p.angle,radius,arc:Math.PI*140/180};for(const e of enemies.slice()){if(e.dead||!CombatStyle.contains(e,cone))continue;hits++;damage(e,p.power*(1.4+p.charge*1.1)*titanRightBonus(e),'hero');if(!e.dead){titanFreeze(e,.5+tValue('warden',2)+p.charge*.6);if(e.type!==3&&tRank('warden',4)){e.x=Math.max(W*.1,Math.min(W*.9,e.x+Math.cos(p.angle)*tValue('warden',4)));e.y=Math.max(H*.16,Math.min(H*.87,e.y+Math.sin(p.angle)*tValue('warden',4)))}}}titanShield(tValue('warden',3)+(p.charge?18:0));if(p.charge>=.95&&tRank('warden',8)){titansCombat.fields.push({x:run.x+Math.cos(p.angle)*radius*.5,y:run.y+Math.sin(p.angle)*radius*.5,r:radius*.8,ticks:3,cd:1,power:p.power*.55});if(titansCombat.fields.length>3)titansCombat.fields.shift()}emitRecastFX('frostWave',{...p,radius});sound('heavy')}return hits}
function tickTitans(dt){if(!canRecast())return;titansCombat.retaliate=Math.max(0,titansCombat.retaliate-dt);titansCombat.markPulse-=dt;if(tRank('command',5)&&recast.mark&&!recast.mark.dead&&recast.markTime>0&&titansCombat.markPulse<=0){damage(recast.mark,manualBaseHit()*tValue('command',5)*titanRightBonus(recast.mark),'hero');titansCombat.markPulse=1;particles.push({x:run.x,y:run.y-25,x2:recast.mark.x,y2:recast.mark.y-10,life:.2,bolt:true,color:'#a7e6a6'})}for(const f of titansCombat.fields){f.cd-=dt;if(f.cd<=0&&f.ticks>0){f.cd+=1;f.ticks--;for(const e of enemies.slice())if(!e.dead&&dist(e,f)<f.r){damage(e,f.power*titanRightBonus(e),'hero');if(!e.dead)titanFreeze(e,.25,.2)}titansCombat.stats.pulses++;ArcadeVFX.emit('frostWave',{x:f.x,y:f.y,angle:0,radius:f.r,charge:1})}}titansCombat.fields=titansCombat.fields.filter(f=>f.ticks>0)}
function titanRetaliate(){const rank=tRank('warden',6);if(!rank||titansCombat.retaliate>0||run.hp<=0)return;titansCombat.retaliate=8;for(const e of nearestEnemies(run,tValue('warden',6),190))damage(e,manualBaseHit()*.6,'hero');titansCombat.stats.retaliations++;ArcadeVFX.emit('frostWave',{x:run.x,y:run.y,angle:0,radius:130,charge:.5})}
function titanDeathExplosion(e){if(e.titanExploded||!tRank('element',7)||e.burnSource!=='hero'||!(e.burnTime>0))return;e.titanExploded=true;const n=e.burnDamage*tValue('element',7);titansCombat.stats.explosions++;for(const v of enemies.slice())if(v!==e&&!v.dead&&v.hp>0&&dist(v,e)<75)damage(v,n,'hero');ArcadeVFX.emit('emberWave',{x:e.x,y:e.y,angle:0,radius:75,charge:.8})}
function titanSaleEligible(x,mode=titanSaleMode,protect=titanSaleProtect){return !x.equipped&&!x.locked&&(!protect||x.enhance===0)&&(mode==='all'||RARITIES.indexOf(x.rarity)<(mode==='legendary'?4:3))}
function previewTitanSale(){const items=account.items.filter(x=>titanSaleEligible(x));titanSalePreview={ids:items.map(x=>x.id),gold:Math.min(1e12-account.gold,items.reduce((n,x)=>n+x.power*2+x.enhance*3,0)),mode:titanSaleMode,protect:titanSaleProtect};renderPane();return titanSalePreview}
function confirmTitanSale(){const p=titanSalePreview;if(!p)return false;if(account.gold>=1e12){toast('金币已达上限，未出售任何装备');return false}titanSalePreview=null;const ids=new Set(p.ids),items=account.items.filter(x=>ids.has(x.id)&&titanSaleEligible(x,p.mode,p.protect));if(!items.length){renderPane();return false}const value=items.reduce((n,x)=>n+x.power*2+x.enhance*3,0),before=account.gold;account.items=account.items.filter(x=>!items.includes(x));account.gold=Math.min(1e12,account.gold+value);titanSaleUndo={items:JSON.parse(JSON.stringify(items)),gold:account.gold-before};growthFeedback();toast('已出售 '+items.length+' 件 · 金币 +'+(account.gold-before)+'（可撤销）');return true}
function undoTitanSale(){const u=titanSaleUndo;if(!u)return false;if(account.gold<u.gold||account.items.length+u.items.length>account.stashCapacity||u.items.some(x=>account.items.some(v=>v.id===x.id))){toast('撤销需保留出售所得与足够空格；新掉落完整保留');return false}account.gold-=u.gold;account.items.push(...u.items);titanSaleUndo=null;growthFeedback();toast('已撤销最近一次出售');return true}

function enhanceById(id){const i=account.items.findIndex(x=>x.id===id);if(i>=0)enhance(i)}

if(chosen){const current=account.items.find(x=>x.equipped&&x.slot===chosen.slot&&x.id!==chosen.id),stats=effectiveItemStats(chosen),old=chosen.equipped?stats:current?effectiveItemStats(current):blankGearStats();html+='<section id="selectedCompare" class="gearCompare rarity-'+chosen.rarity+'"><div class="gearCompareTitle">'+iconFor(chosen)+'<div><b>'+chosen.name+' +'+chosen.enhance+'</b><small>'+RARITY_NAMES[chosen.rarity]+' · '+SLOT_NAMES[chosen.slot]+' · iLv.'+chosen.ilvl+(chosen.legacy?' · 旧版遗物继承':'')+'</small></div></div><p class="paneHint">'+(chosen.equipped?'当前穿戴中':current?'对比：'+current.name+' +'+current.enhance:'该槽位当前空置')+'</p>'+GEAR_KEYS.filter(k=>stats[k]||old[k]).map(k=>'<div class="compareStat"><span>'+GEAR_LABELS[k]+'</span><b>'+stats[k]+'</b><em class="'+(stats[k]>=old[k]?'positive':'negative')+'">'+(stats[k]-old[k]>=0?'+':'')+(stats[k]-old[k])+'</em></div>').join('')+(chosen.affix?'<p class="legendaryAffix">传奇：'+affixText(chosen.affix)+'</p>':'')+(chosen.legacy?'<p class="paneHint">旧版power '+chosen.power+' 与强化保留，等值继承为主公/召唤伤害，不清零旧属性。</p>':'')+'<div class="inventoryActions"><button id="selectedEquip" onclick="equipById(\''+chosen.id+'\')"></button><button id="selectedEnhance" onclick="enhanceById(\''+chosen.id+'\')"></button><button id="selectedLock" onclick="lockItem(\''+chosen.id+'\')"></button><button id="selectedSalvage" onclick="salvageById(\''+chosen.id+'\')"></button></div><p class="paneHint">同槽穿戴只替换标记，原装备仍留在箱中。强化不补血；基础分解回收 '+(chosen.power*2+chosen.enhance*3)+' 金 / '+(1+Math.floor(chosen.enhance/2)+(chosen.affix?3:0))+' 材。须两次确认，已穿戴不可分解。</p></section>'}else html+='<p class="emptyState">首领掉落装备宝箱；靠近拾取，自动战斗会延迟代收。</p>';html=transformInventoryMarkup(html);box.innerHTML=html;box.scrollTop=scroll;paneDirty=false;refreshInventoryValues()}

function validateInkBase(text){const raw=JSON.parse(text);validateTitans(raw);validateRecast(raw);validatePremiumFields(raw);if(raw.restartCount!==undefined&&(!Number.isInteger(raw.restartCount)||raw.restartCount<0||raw.restartCount>1000000))throw Error('重启次数不合法');if(raw.pendingReward!==undefined&&raw.pendingReward!==null){const item=raw.pendingReward;if(Array.isArray(raw.items)&&raw.items.some(x=>x?.id===item.id))throw Error('待领传奇ID与箱中物品重复');if(item.rarity!=='legendary'||typeof item.name!=='string'||!item.name.startsWith('轮回·')||item.equipped)throw Error('待领传奇不合法');validateSaveJSON(JSON.stringify({...raw,pendingReward:null,items:[item],stashCapacity:300}))}const isNew=[5,6,7,8,9,10].includes(raw?.schema);TT2.validate(raw?.tt2);if((isNew||raw?.stashCapacity!==undefined)&&!(raw?.schema>=6?[200,300]:[50,100]).includes(raw.stashCapacity))throw Error('战利品箱容量不合法');if(isNew&&Array.isArray(raw.items)&&raw.items.length>raw.stashCapacity)throw Error('箱中物品超过已解锁容量');const ids=new Set(),slots=new Set();for(const item of raw?.items||[]){if(isNew){if(typeof item.id!=='string'||!/^[a-z0-9_-]{1,64}$/i.test(item.id)||ids.has(item.id))throw Error('装备ID不合法或重复');ids.add(item.id);if(!GEAR_SLOTS.includes(item.slot)||!RARITIES.includes(item.rarity)||!Number.isInteger(item.ilvl)||item.ilvl<1||item.ilvl>999||!Object.hasOwn(ITEM_CATALOG,item.catalog)||ITEM_CATALOG[item.catalog].slot!==item.slot)throw Error('装备槽位、品质、等级或图案目录不合法');if(typeof item.legacy!=='boolean'||!item.stats||typeof item.stats!=='object'||Array.isArray(item.stats)||Object.keys(item.stats).some(k=>!GEAR_KEYS.includes(k))||!GEAR_KEYS.every(k=>Number.isInteger(item.stats[k])&&item.stats[k]>=0&&item.stats[k]<=GEAR_LIMITS[k]))throw Error('装备多属性不合法');if(item.equipped&&slots.has(item.slot))throw Error('同一槽位不可穿戴两件');if(item.equipped)slots.add(item.slot)}}const clean=validateSaveJSONInventoryBase(text);if(clean.items.length>clean.stashCapacity)throw Error('装备数量超过箱子容量');return clean}

function combatAllowed(){return run.phase==='fighting'||run.phase==='waiting'}

function resumeAdvance(){if(run.phase!=='waiting')return false;beginStage(false);run.waitingBeforeDeath=false;hud(true);return true}
function retryBattle(){if(!['reviving','fallen'].includes(run.phase))return false;const waiting=run.waitingBeforeDeath;if(waiting)beginWaiting(true);else beginStage(true);run.waitingBeforeDeath=false;return true}

function draw(){if(!paused&&!suspended&&!SanguoFormation.editing&&legionHitStop<=0){renderClock+=renderDelta;if(typeof RigMotion!=='undefined')RigMotion.tick(renderDelta)}const start=typeof performance!=='undefined'?performance.now():0;drawEngine();qualityStats.frames++;if(start){const elapsed=performance.now()-start;qualityStats.drawMs+=elapsed;qualityStats.drawWorst=Math.max(qualityStats.drawWorst,elapsed)}}
